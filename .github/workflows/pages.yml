# Publishes the static github-pages/ folder to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths: ["github-pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish the page, the power planner modules and data, not the worker source
      - run: |
          mkdir _site
          cp github-pages/index.html github-pages/planner-*.js _site/
          cp -r github-pages/data _site/
          # icons / web manifest, if present
          cp github-pages/*.png github-pages/*.ico github-pages/*.webmanifest _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
